<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DramaBox Admin - ระบบจัดการหลังบ้าน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap'); body { font-family: 'Prompt', sans-serif; background-color: #0f172a; color: #f8fafc; }</style>
</head>
<body class="bg-slate-950 min-h-screen p-4 flex justify-center">
    <div class="w-full max-w-md bg-slate-900 min-h-screen p-4 rounded-2xl border border-slate-800 flex flex-col">
        <div class="flex justify-between items-center pb-3 border-b border-slate-800 mb-4">
            <h1 class="text-base font-bold text-white flex items-center space-x-2">
                <i class="fa-solid fa-gear text-rose-500"></i>
                <span>ระบบจัดการแอดมิน (Admin Panel)</span>
            </h1>
            <a href="index.html" class="text-xs text-rose-400 hover:underline"><i class="fa-solid fa-arrow-left mr-1"></i>ไปหน้าเว็บคนดู</a>
        </div>

        <div class="space-y-4 flex-1">
            <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                <h2 class="text-sm font-semibold mb-3 text-white">เพิ่มซีรีส์ใหม่</h2>
                <input type="text" id="newTitle" placeholder="ชื่อซีรีส์" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white mb-2">
                <input type="text" id="newCategory" placeholder="หมวดหมู่ (เช่น ดราม่า, โรแมนติก)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white mb-2">
                <input type="text" id="newCover" placeholder="ลิงก์รูปภาพปกซีรีส์" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white mb-2">
                <input type="text" id="newVideoUrl" placeholder="ลิงก์วิดีโอตอนที่ 1 (.mp4)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white mb-3">
                <button onclick="addNewDrama()" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-medium py-2.5 rounded-lg text-xs shadow-lg">บันทึกเพิ่มซีรีส์</button>
            </div>

            <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                <h2 class="text-sm font-semibold mb-3 text-white">รายการซีรีส์ทั้งหมดในระบบ</h2>
                <div id="adminDramaList" class="space-y-2 max-h-72 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <script>
        let dramas = JSON.parse(localStorage.getItem('db_dramas')) || [
            { id: 1, title: 'เกิดใหม่เป็นเถ้าแก่พะโล้', category: 'ดราม่า', cover: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=60', views: '45.2K', eps: 2, video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4' }
        ];

        function renderAdminList() {
            const list = document.getElementById('adminDramaList');
            if(dramas.length === 0) {
                list.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">ยังไม่มีซีรีส์ในระบบ</p>';
                return;
            }
            list.innerHTML = dramas.map(d => `
                <div class="flex justify-between items-center bg-slate-900 p-3 rounded-lg text-xs border border-slate-800">
                    <div>
                        <span class="text-white font-medium block">${d.title}</span>
                        <span class="text-[10px] text-slate-400">${d.category} • ${d.eps} ตอน</span>
                    </div>
                    <button onclick="deleteDrama(${d.id})" class="text-rose-400 hover:text-rose-300 p-1.5"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        function addNewDrama() {
            const title = document.getElementById('newTitle').value;
            const category = document.getElementById('newCategory').value;
            const cover = document.getElementById('newCover').value;
            const video = document.getElementById('newVideoUrl').value;
            if(!title || !cover || !video) { alert('กรุณากรอกข้อมูลให้ครบถ้วน'); return; }
            
            dramas.push({ id: Date.now(), title, category: category || 'ทั่วไป', cover, views: '1.0K', eps: 2, video });
            localStorage.setItem('db_dramas', JSON.stringify(dramas));
            alert('เพิ่มซีรีส์สำเร็จ!');
            document.getElementById('newTitle').value = '';
            document.getElementById('newCover').value = '';
            document.getElementById('newVideoUrl').value = '';
            renderAdminList();
        }

        function deleteDrama(id) {
            if(confirm('ต้องการลบซีรีส์นี้ใช่หรือไม่?')) {
                dramas = dramas.filter(x => x.id !== id);
                localStorage.setItem('db_dramas', JSON.stringify(dramas));
                renderAdminList();
            }
        }

        renderAdminList();
    </script>
</body>
</html>
