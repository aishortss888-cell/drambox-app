<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DramaBox Pro - สตรีมมิ่งซีรีส์สั้นสุดฮิต</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Prompt', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 min-h-screen flex flex-col items-center">

    <div class="w-full max-w-md bg-slate-900 min-h-screen shadow-2xl flex flex-col relative overflow-hidden pb-20">
        <!-- HEADER (ไม่มีปุ่มแอดมินแล้ว) -->
        <header class="px-4 py-3 bg-slate-900/85 backdrop-blur-md sticky top-0 z-40 flex justify-between items-center border-b border-slate-800">
            <div class="flex items-center space-x-2">
                <div class="bg-gradient-to-r from-red-600 to-rose-500 text-white font-bold px-2.5 py-1 rounded-lg text-sm tracking-wider shadow-lg">DB</div>
                <h1 class="font-bold text-lg text-white tracking-wide">DramaBox <span class="text-rose-500 text-xs">PRO</span></h1>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openWalletModal()" class="bg-slate-800 hover:bg-slate-700 text-amber-400 px-3 py-1.5 rounded-full text-xs font-medium flex items-center space-x-1.5 border border-amber-500/30">
                    <i class="fa-solid fa-coins"></i>
                    <span id="userCoins">120</span>
                </button>
            </div>
        </header>

        <!-- MAIN VIEW -->
        <main id="mainContent" class="flex-1 overflow-y-auto hide-scroll">
            <!-- Dynamic Content -->
        </main>

        <!-- BOTTOM NAV -->
        <nav class="absolute bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-6 py-2.5 flex justify-between items-center z-40">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-rose-500 transition">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">หน้าแรก</span>
            </button>
            <button onclick="switchTab('explore')" id="nav-explore" class="flex flex-col items-center text-slate-400 hover:text-slate-200 transition">
                <i class="fa-solid fa-compass text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">สำรวจ</span>
            </button>
            <button onclick="switchTab('vip')" id="nav-vip" class="flex flex-col items-center text-slate-400 hover:text-slate-200 transition">
                <i class="fa-solid fa-crown text-lg text-amber-400"></i>
                <span class="text-[10px] mt-1 font-medium">VIP</span>
            </button>
            <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center text-slate-400 hover:text-slate-200 transition">
                <i class="fa-solid fa-user text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">ฉัน</span>
            </button>
        </nav>

        <!-- VIDEO PLAYER MODAL -->
        <div id="playerModal" class="fixed inset-0 bg-black z-50 hidden flex flex-col">
            <div class="relative w-full aspect-[9/16] bg-black max-h-[60vh] flex items-center justify-center">
                <video id="videoPlayer" class="w-full h-full object-contain" controls autoplay playsinline></video>
                <button onclick="closePlayer()" class="absolute top-4 left-4 bg-black/60 text-white w-9 h-9 rounded-full flex items-center justify-center backdrop-blur-sm"><i class="fa-solid fa-arrow-left"></i></button>
            </div>
            <div class="flex-1 bg-slate-900 p-4 overflow-y-auto rounded-t-2xl -mt-4 relative z-10">
                <div class="flex justify-between items-start mb-3">
                    <div>
                        <h2 id="playerDramaTitle" class="text-lg font-bold text-white">ชื่อซีรีส์</h2>
                        <p id="playerEpTitle" class="text-xs text-slate-400">ตอนที่ 1</p>
                    </div>
                    <button onclick="toggleFavorite()" id="favBtn" class="text-slate-400 text-xl"><i class="fa-regular fa-heart"></i></button>
                </div>
                <div class="border-t border-slate-800 pt-3">
                    <h3 class="text-xs font-semibold text-slate-400 mb-2">เลือกตอนทั้งหมด</h3>
                    <div id="episodesListGrid" class="grid grid-cols-5 gap-2"></div>
                </div>
            </div>
        </div>

        <!-- WALLET MODAL -->
        <div id="walletModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-end justify-center">
            <div class="bg-slate-900 w-full max-w-md p-6 rounded-t-3xl border-t border-slate-800">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-white flex items-center space-x-2"><i class="fa-solid fa-coins text-amber-400"></i><span>เติมเหรียญ DramaBox</span></h3>
                    <button onclick="closeWalletModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div onclick="rechargeCoins(100)" class="bg-slate-800 border border-slate-700 hover:border-amber-500 p-3 rounded-xl cursor-pointer text-center">
                        <div class="text-amber-400 font-bold text-lg">100 เหรียญ</div>
                        <div class="text-xs text-slate-400">35 บาท</div>
                    </div>
                    <div onclick="rechargeCoins(300)" class="bg-slate-800 border border-slate-700 hover:border-amber-500 p-3 rounded-xl cursor-pointer text-center">
                        <div class="text-amber-400 font-bold text-lg">300 เหรียญ</div>
                        <div class="text-xs text-slate-400">99 บาท</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let dramas = JSON.parse(localStorage.getItem('db_dramas')) || [
            { id: 1, title: 'เกิดใหม่เป็นเถ้าแก่พะโล้', category: 'ดราม่า', cover: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=60', views: '45.2K', eps: 2, video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4' }
        ];

        let userCoins = parseInt(localStorage.getItem('db_coins')) || 120;
        let favorites = JSON.parse(localStorage.getItem('db_fav')) || [];
        let currentTab = 'home';
        let activeDrama = null;

        document.getElementById('userCoins').innerText = userCoins;

        function switchTab(tab) {
            currentTab = tab;
            ['home', 'explore', 'vip', 'profile'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                btn.className = t === tab ? "flex flex-col items-center text-rose-500 transition" : "flex flex-col items-center text-slate-400 hover:text-slate-200 transition";
            });
            renderContent();
        }

        function renderContent() {
            const main = document.getElementById('mainContent');
            if (currentTab === 'home') {
                main.innerHTML = `
                    <div class="p-4 space-y-4">
                        ${dramas.length > 0 ? `
                        <div class="relative rounded-2xl overflow-hidden aspect-[16/9] shadow-lg cursor-pointer" onclick="openPlayer(${dramas[0].id})">
                            <img src="${dramas[0].cover}" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent flex flex-col justify-end p-4">
                                <span class="bg-rose-600 text-white text-[10px] font-bold px-2 py-0.5 rounded w-fit mb-1">มาแรง 🔥</span>
                                <h2 class="text-lg font-bold text-white">${dramas[0].title}</h2>
                                <p class="text-xs text-slate-300">หมวด: ${dramas[0].category}</p>
                            </div>
                        </div>` : ''}
                        <div>
                            <h3 class="font-bold text-sm text-white mb-3">ซีรีส์ทั้งหมด</h3>
                            <div class="grid grid-cols-2 gap-3">
                                ${dramas.map(d => `
                                    <div onclick="openPlayer(${d.id})" class="bg-slate-900 rounded-xl overflow-hidden border border-slate-800 cursor-pointer group">
                                        <div class="aspect-[3/4] overflow-hidden relative">
                                            <img src="${d.cover}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                                            <div class="absolute bottom-2 right-2 bg-black/60 backdrop-blur-sm text-[10px] px-2 py-0.5 rounded text-white">${d.eps} ตอน</div>
                                        </div>
                                        <div class="p-2.5">
                                            <h4 class="font-semibold text-xs text-white truncate">${d.title}</h4>
                                            <p class="text-[10px] text-slate-400 mt-0.5">${d.category}</p>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'explore') {
                main.innerHTML = `<div class="p-4 space-y-3"><input type="text" oninput="searchDrama(this.value)" placeholder="ค้นหาชื่อซีรีส์..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-rose-500"><div id="exploreList" class="grid grid-cols-2 gap-3 mt-3">${dramas.map(d => `<div onclick="openPlayer(${d.id})" class="bg-slate-900 rounded-xl overflow-hidden border border-slate-800 cursor-pointer"><div class="aspect-[3/4]"><img src="${d.cover}" class="w-full h-full object-cover"></div><div class="p-2.5"><h4 class="font-semibold text-xs text-white truncate">${d.title}</h4><p class="text-[10px] text-slate-400">${d.category}</p></div></div>`).join('')}</div></div>`;
            } else if (currentTab === 'vip') {
                main.innerHTML = `<div class="p-6 text-center space-y-4"><div class="w-16 h-16 bg-gradient-to-tr from-amber-500 to-yellow-300 rounded-full flex items-center justify-center mx-auto shadow-lg"><i class="fa-solid fa-crown text-slate-950 text-2xl"></i></div><h2 class="text-xl font-bold text-white">สมาชิก VIP</h2><p class="text-xs text-slate-400">ดูซีรีส์ได้ทุกเรื่องแบบไม่อั้น ไม่มีโฆษณา</p><button onclick="alert('จำลองการสมัคร VIP สำเร็จ!')" class="w-full bg-amber-500 text-slate-950 font-bold py-3 rounded-xl text-xs">สมัคร VIP รายเดือน (199 บาท)</button></div>`;
            } else if (currentTab === 'profile') {
                main.innerHTML = `<div class="p-4 space-y-4"><div class="flex items-center space-x-3 bg-slate-900 p-4 rounded-2xl border border-slate-800"><div class="w-12 h-12 bg-rose-600 rounded-full flex items-center justify-center font-bold text-white">DB</div><div><h3 class="font-bold text-sm text-white">คุณ Dechawat</h3><p class="text-[10px] text-slate-400">ผู้ใช้งานทั่วไป</p></div></div></div>`;
            }
        }

        function openPlayer(id) {
            activeDrama = dramas.find(x => x.id === id);
            if(!activeDrama) return;
            document.getElementById('playerDramaTitle').innerText = activeDrama.title;
            document.getElementById('videoPlayer').src = activeDrama.video;
            const grid = document.getElementById('episodesListGrid');
            grid.innerHTML = '';
            for(let i=1; i<=activeDrama.eps; i++) {
                grid.innerHTML += `<button onclick="document.getElementById('playerEpTitle').innerText='กำลังเล่นตอนที่ ${i}'" class="py-2.5 rounded-lg text-xs font-semibold bg-rose-600 text-white">ตอนที่ ${i}</button>`;
            }
            document.getElementById('playerModal').classList.remove('hidden');
        }

        function closePlayer() { document.getElementById('videoPlayer').pause(); document.getElementById('playerModal').classList.add('hidden'); }
        function openWalletModal() { document.getElementById('walletModal').classList.remove('hidden'); }
        function closeWalletModal() { document.getElementById('walletModal').classList.add('hidden'); }
        function rechargeCoins(amt) { userCoins += amt; localStorage.setItem('db_coins', userCoins); document.getElementById('userCoins').innerText = userCoins; closeWalletModal(); alert(`เติมสำเร็จ +${amt} เหรียญ`); }
        
        renderContent();
    </script>
</body>
</html>
